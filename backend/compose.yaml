services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: tvbox-ai-mongodb
    restart: unless-stopped
    volumes:
      - tvbox_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - basic_component

  controller:
    build: .
    image: tvbox-ai-controller:latest
    container_name: tvbox-ai-controller
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-tvbox_ai}
      SERVER_PORT: ${SERVER_PORT:-8000}
      ROOT_PATH: ${ROOT_PATH:-}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    networks:
      - basic_component

volumes:
  tvbox_mongo_data:

networks:
  basic_component:
    external: true

